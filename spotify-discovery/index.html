<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Discovery - Find Curated Playlists</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Playlist Discovery</h1>
            <p class="subtitle">Find curated playlists by genre, mood, or artist</p>
        </header>

        <!-- Search Input -->
        <section id="input-section" class="card">
            <label for="search-input">What are you in the mood for?</label>
            <div class="input-group">
                <input
                    type="text"
                    id="search-input"
                    placeholder="e.g. chill, workout, jazz, 90s hip hop, study..."
                    autocomplete="off"
                >
                <button id="search-btn" class="btn btn-primary">Find Playlists</button>
            </div>
            <div class="quick-tags">
                <span class="quick-tag" data-query="chill">chill</span>
                <span class="quick-tag" data-query="workout">workout</span>
                <span class="quick-tag" data-query="party">party</span>
                <span class="quick-tag" data-query="focus">focus</span>
                <span class="quick-tag" data-query="sleep">sleep</span>
                <span class="quick-tag" data-query="jazz">jazz</span>
                <span class="quick-tag" data-query="hip hop">hip hop</span>
                <span class="quick-tag" data-query="rock">rock</span>
            </div>
        </section>

        <!-- Loading State -->
        <section id="loading-section" class="card hidden">
            <div class="loader"></div>
            <p id="loading-text">Finding playlists...</p>
        </section>

        <!-- Results -->
        <section id="results-section" class="hidden">
            <div class="results-header">
                <h2>Playlists for "<span id="search-query"></span>"</h2>
                <p id="results-count">0 playlists found</p>
            </div>
            <div id="playlists-grid" class="playlists-grid">
                <!-- Playlists will be inserted here -->
            </div>
        </section>

        <!-- Error State -->
        <section id="error-section" class="card error hidden">
            <h2>No playlists found</h2>
            <p id="error-message">Try a different search term.</p>
            <button id="retry-btn" class="btn btn-outline">Try Again</button>
        </section>

        <footer>
            <p>Powered by <a href="https://developers.deezer.com/" target="_blank">Deezer API</a></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
